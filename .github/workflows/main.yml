name: Basic API Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  parallel-api-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # Each marker is a separate runner i.e parallel execution of tests with different markers
      matrix:
        marker: [smoke, sanity]


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Run tests in parallel with xdist
        # xdist for CPU's parallelism in each group (-n auto)
        run: pytest -v tests/${{ matrix.marker }} -n auto --alluredir=allure-results


      - name: Upload Allure Results (per group)
        uses: actions/upload-artifact@v4
        with:
            name: allure-${{ matrix.marker }}
            path: allure-results

  merge-reports:
    runs-on: ubuntu-latest
    needs: parallel-api-tests   # ✅ waits for all matrix jobs
  
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
  
      - name: Download Allure Results from matrix jobs
        uses: actions/download-artifact@v4
        with:
          path: merged-results
  
      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre unzip wget
          
          
          LATEST_URL=$(curl -s https://api.github.com/repos/allure-framework/allure2/releases/latest \
                     | grep browser_download_url \
                     | grep -E "allure-.*zip" \
                     | cut -d '"' -f 4)

          echo "Downloading Allure from $LATEST_URL"
          wget -q $LATEST_URL -O allure.zip

          unzip -q allure.zip -d /opt/allure
          sudo ln -sf /opt/allure/allure-*/bin/allure /usr/local/bin/allure

          # Verify installation
          allure --version

      - name: Merge Allure Results
        run: |
            mkdir -p final-results
            cp -r tests/sanity/* final-results/
            cp -r tests/sanity/* final-results/

      - name: Generate final HTML Allure Report
        run: |
            allure generate final-results -o final-report --clean

      - name: Upload Final Allure Report
        uses: actions/upload-artifact@v4
        with:
            name: allure-report
            path: final-report
  


